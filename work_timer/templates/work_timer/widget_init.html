{# Модалки + скрипт таймера (подключается перед </body>) #}

<style>
  .timer-modal .modal-content {
    border-radius: 16px;
    border: none;
    box-shadow: 0 8px 32px rgba(0,0,0,0.18);
  }
  .timer-modal .modal-header {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: #fff;
    border-radius: 16px 16px 0 0;
    border-bottom: none;
  }
  .timer-modal .btn-close {
    filter: brightness(0) invert(1);
  }
  .timer-modal .modal-body label {
    font-weight: 600;
    color: #333;
  }
  .timer-history-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0.5rem 0;
    border-bottom: 1px solid #eee;
    font-size: 0.9rem;
    gap: 0.5rem;
  }
  .timer-history-row:last-child { border-bottom: none; }
  .timer-history-row .dur {
    font-weight: 600;
    color: #667eea;
    white-space: nowrap;
  }
  .timer-history-row .session-info {
    flex: 1;
    min-width: 0;
  }
  .timer-history-row .session-actions {
    display: flex;
    gap: 4px;
    flex-shrink: 0;
  }
  .timer-history-row .session-actions button {
    background: none;
    border: 1px solid #ddd;
    border-radius: 6px;
    width: 28px;
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 0.8rem;
    color: #666;
    transition: all 0.15s;
    padding: 0;
  }
  .timer-history-row .session-actions .btn-edit:hover {
    background: #eef;
    border-color: #667eea;
    color: #667eea;
  }
  .timer-history-row .session-actions .btn-del:hover {
    background: #fee;
    border-color: #dc3545;
    color: #dc3545;
  }
</style>

<!-- Модалка настроек -->
<div class="modal fade timer-modal" id="timerSettingsModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Настройки таймера</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="mb-3">
          <label for="dailyGoalInput" class="form-label">Цель на день (часы)</label>
          <input type="number" class="form-control" id="dailyGoalInput" min="0.5" max="24" step="0.5" value="8">
        </div>
        <hr>
        <h6>Последние сессии</h6>
        <div id="timerHistoryList"><small class="text-muted">Загрузка...</small></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Закрыть</button>
        <button type="button" class="btn btn-primary" id="saveSettingsBtn">Сохранить</button>
      </div>
    </div>
  </div>
</div>

<!-- Модалка редактирования сессии -->
<div class="modal fade timer-modal" id="timerEditModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Редактировать сессию</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="editSessionId">
        <div class="mb-3">
          <label for="editStartTime" class="form-label">Начало</label>
          <input type="datetime-local" class="form-control" id="editStartTime">
        </div>
        <div class="mb-3">
          <label for="editEndTime" class="form-label">Конец</label>
          <input type="datetime-local" class="form-control" id="editEndTime">
          <div class="form-text">Оставьте пустым, если сессия ещё идёт</div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
        <button type="button" class="btn btn-primary" id="saveEditBtn">Сохранить</button>
      </div>
    </div>
  </div>
</div>

<script>
(function() {
  /* ---------- SVG иконки ---------- */
  var SVG_DUMBBELL = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect x="18" y="4" width="10" height="22" rx="3" fill="%23f59e0b" stroke="%23dc2626" stroke-width="2.5"/><rect x="36" y="4" width="10" height="22" rx="3" fill="%23f59e0b" stroke="%23dc2626" stroke-width="2.5"/><rect x="8" y="10" width="10" height="10" rx="2" fill="%23ef4444"/><rect x="46" y="10" width="10" height="10" rx="2" fill="%23ef4444"/><rect x="28" y="18" width="8" height="28" rx="2" fill="%236366f1"/></svg>';
  var SVG_GREEN = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><circle cx="32" cy="32" r="28" fill="%2322c55e" stroke="%2316a34a" stroke-width="3"/></svg>';

  var faviconEl = document.getElementById('faviconDynamic');

  function setFaviconRunning() {
    if (!faviconEl) return;
    faviconEl.href = 'data:image/svg+xml,' + encodeURIComponent(SVG_GREEN);
    faviconEl.classList.remove('blink');
  }
  function setFaviconIdle() {
    if (!faviconEl) return;
    faviconEl.href = 'data:image/svg+xml,' + encodeURIComponent(SVG_DUMBBELL);
    faviconEl.classList.add('blink');
  }

  /* ---------- API ---------- */
  var API = {
    status:      '{% url "timer_status" %}',
    start:       '{% url "timer_start" %}',
    stop:        '{% url "timer_stop" %}',
    settings:    '{% url "timer_settings_get" %}',
    saveSet:     '{% url "timer_settings_save" %}',
    history:     '{% url "timer_history" %}',
    sessionEdit: '{% url "session_edit" 0 %}'.replace('0/', ''),
    sessionDel:  '{% url "session_delete" 0 %}'.replace('0/', '')
  };

  var isRunning = false;
  var elapsed = 0;
  var todayTotal = 0;
  var todayGoal = 28800;
  var tickInterval = null;

  /* ---------- DOM ---------- */
  function $(id) { return document.getElementById(id); }

  var clockEl     = $('timerClock');
  var totalEl     = $('timerTotal');
  var toggleBtn   = $('timerToggle');
  var toggleIcon  = $('toggleIcon');
  var settingsBtn = $('timerSettingsBtn');
  var progressEl  = $('timerProgress');
  var clockM      = $('timerClockMobile');
  var totalM      = $('timerTotalMobile');
  var toggleBtnM  = $('timerToggleMobile');
  var toggleIconM = $('toggleIconMobile');
  var settingsBtnM= $('timerSettingsBtnMobile');
  var progressM   = $('timerProgressMobile');
  var goalInput   = $('dailyGoalInput');
  var saveBtn     = $('saveSettingsBtn');
  var historyList = $('timerHistoryList');
  var editIdEl    = $('editSessionId');
  var editStartEl = $('editStartTime');
  var editEndEl   = $('editEndTime');
  var saveEditBtn = $('saveEditBtn');
  var settingsModal, editModal;

  /* ---------- утилиты ---------- */

  function fmt(sec) {
    var h = Math.floor(sec / 3600);
    var m = Math.floor((sec % 3600) / 60);
    var s = Math.floor(sec % 60);
    return String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
  }
  function fmtShort(sec) {
    var h = Math.floor(sec / 3600);
    var m = Math.floor((sec % 3600) / 60);
    if (h > 0) return h + '\u0447 ' + String(m).padStart(2,'0') + '\u043c';
    return m + '\u043c ' + String(Math.floor(sec % 60)).padStart(2,'0') + '\u0441';
  }
  function getCsrf() {
    var m = document.cookie.match(/csrftoken=([^;]+)/);
    return m ? m[1] : '';
  }
  function postJson(url, data) {
    return fetch(url, {
      method: 'POST',
      headers: {'Content-Type': 'application/json', 'X-CSRFToken': getCsrf()},
      body: JSON.stringify(data)
    });
  }
  function postForm(url) {
    return fetch(url, {
      method: 'POST',
      headers: {'X-CSRFToken': getCsrf()}
    });
  }

  /* ---------- рендер ---------- */

  function render() {
    var display = fmt(elapsed);
    var td = '\u0421\u0435\u0433\u043e\u0434\u043d\u044f: ' + fmtShort(todayTotal);

    if (clockEl) clockEl.textContent = display;
    if (totalEl) totalEl.textContent = td;
    if (clockM) clockM.textContent = display;
    if (totalM) totalM.textContent = td;

    if (isRunning) {
      if (toggleIcon)  toggleIcon.textContent = '\u25A0';
      if (toggleIconM) toggleIconM.textContent = '\u25A0';
      if (toggleBtn)  toggleBtn.classList.add('btn-stop');
      if (toggleBtnM)  toggleBtnM.classList.add('btn-stop');
      if (clockEl) clockEl.classList.add('running');
      if (clockM) clockM.classList.add('running');
      setFaviconRunning();
    } else {
      if (toggleIcon)  toggleIcon.textContent = '\u25B6';
      if (toggleIconM) toggleIconM.textContent = '\u25B6';
      if (toggleBtn)  toggleBtn.classList.remove('btn-stop');
      if (toggleBtnM)  toggleBtnM.classList.remove('btn-stop');
      if (clockEl) clockEl.classList.remove('running');
      if (clockM) clockM.classList.remove('running');
      setFaviconIdle();
    }

    var pct = Math.min((todayTotal / todayGoal) * 100, 100);
    if (progressEl) progressEl.style.width = pct + '%';
    if (progressM)  progressM.style.width = pct + '%';
  }

  /* ---------- тик ---------- */

  function startTick() {
    if (tickInterval) return;
    tickInterval = setInterval(function() {
      elapsed += 1;
      todayTotal += 1;
      render();
    }, 1000);
  }
  function stopTick() {
    clearInterval(tickInterval);
    tickInterval = null;
  }

  /* ---------- API ---------- */

  function fetchStatus() {
    fetch(API.status)
      .then(function(r) { return r.json(); })
      .then(function(d) {
        isRunning  = d.is_running;
        elapsed    = d.elapsed;
        todayTotal = d.today_total;
        todayGoal  = d.today_goal;
        render();
        if (isRunning) startTick(); else stopTick();
      })
      .catch(function(e) { console.error('timer status:', e); });
  }

  function doStart() {
    postForm(API.start)
      .then(function(r) { return r.json(); })
      .then(function(d) {
        isRunning = d.is_running;
        elapsed   = d.elapsed;
        todayTotal= d.today_total;
        render(); startTick();
      })
      .catch(function(e) { console.error('timer start:', e); });
  }

  function doStop() {
    postForm(API.stop)
      .then(function(r) { return r.json(); })
      .then(function(d) {
        isRunning = d.is_running;
        elapsed   = 0;
        todayTotal= d.today_total;
        render(); stopTick();
      })
      .catch(function(e) { console.error('timer stop:', e); });
  }

  /* ---------- настройки ---------- */

  function loadSettings() {
    fetch(API.settings)
      .then(function(r) { return r.json(); })
      .then(function(d) {
        if (goalInput) goalInput.value = d.daily_goal_hours;
        todayGoal = d.daily_goal_hours * 3600;
      })
      .catch(function() {});
  }

  function saveSettings() {
    postJson(API.saveSet, {daily_goal_hours: parseFloat(goalInput.value)})
      .then(function(r) {
        if (r.ok) {
          todayGoal = parseFloat(goalInput.value) * 3600;
          render();
          if (settingsModal) settingsModal.hide();
        }
      })
      .catch(function() {});
  }

  function loadHistory() {
    fetch(API.history)
      .then(function(r) { return r.json(); })
      .then(function(d) {
        if (!historyList) return;
        if (!d.sessions.length) {
          historyList.innerHTML = '<small class="text-muted">Нет записей</small>';
          return;
        }
        historyList.innerHTML = d.sessions.map(function(s) {
          var dur = fmtShort(s.duration);
          var end = s.end || '...';
          var badge = s.is_running ? ' <span class="badge bg-success">активна</span>' : '';
          return '<div class="timer-history-row" data-id="' + s.id + '">
'
            + '<span class="session-info">' + s.date + ' ' + s.start + ' &ndash; ' + end + badge + '</span>
'
            + '<span class="dur">' + dur + '</span>
'
            + '<span class="session-actions">'
            + '<button type="button" class="btn-edit" title="Редактировать">&#9998;</button>'
            + '<button type="button" class="btn-del" title="Удалить">&#128465;</button>'
            + '</span></div>';
        }).join('');
      })
      .catch(function() {
        if (historyList) historyList.innerHTML = '<small class="text-danger">Ошибка загрузки</small>';
      });
  }

  /* ---------- редактирование / удаление ---------- */

  function openEditModal(id, startFull, endFull) {
    if (!editIdEl) return;
    editIdEl.value = id;
    editStartEl.value = startFull || '';
    editEndEl.value = endFull || '';
    if (editModal) editModal.show();
  }

  function saveEdit() {
    var id = editIdEl ? editIdEl.value : '';
    postJson(API.sessionEdit + id + '/edit/', {
      start_time: editStartEl.value,
      end_time: editEndEl.value
    }).then(function(r) {
      if (r.ok) {
        if (editModal) editModal.hide();
        loadHistory();
        fetchStatus();
      }
    }).catch(function() {});
  }

  function deleteSession(id) {
    if (!confirm('Удалить эту сессию?')) return;
    postForm(API.sessionDel + id + '/delete/')
      .then(function(r) {
        if (r.ok) { loadHistory(); fetchStatus(); }
      })
      .catch(function() {});
  }

  /* ---------- события ---------- */

  // клик по истории (делегирование)
  if (historyList) {
    historyList.addEventListener('click', function(e) {
      var btn = e.target.closest('button');
      if (!btn) return;
      var row = btn.closest('.timer-history-row');
      if (!row) return;
      var id = row.getAttribute('data-id');

      fetch(API.history).then(function(r) { return r.json(); }).then(function(d) {
        var session = d.sessions.find(function(s) { return String(s.id) === id; });
        if (!session) return;
        if (btn.classList.contains('btn-edit')) {
          openEditModal(session.id, session.start_full, session.end_full);
        } else if (btn.classList.contains('btn-del')) {
          deleteSession(session.id);
        }
      });
    });
  }

  // старт/стоп
  function onToggle(e) {
    e.preventDefault();
    e.stopPropagation();
    alert('TIMER CLICK! isRunning=' + isRunning + ' URL=' + (isRunning ? API.stop : API.start));
    if (isRunning) { doStop(); } else { doStart(); }
  }

  if (toggleBtn)  toggleBtn.addEventListener('click', onToggle);
  if (toggleBtnM) toggleBtnM.addEventListener('click', onToggle);

  // настройки
  function openSettings() {
    loadSettings();
    loadHistory();
    if (settingsModal) settingsModal.show();
  }
  if (settingsBtn)  settingsBtn.addEventListener('click', openSettings);
  if (settingsBtnM) settingsBtnM.addEventListener('click', openSettings);
  if (saveBtn)      saveBtn.addEventListener('click', saveSettings);
  if (saveEditBtn)  saveEditBtn.addEventListener('click', saveEdit);

  /* ---------- init ---------- */

  function initModals() {
    settingsModal = new bootstrap.Modal($('timerSettingsModal'));
    editModal     = new bootstrap.Modal($('timerEditModal'));
  }

  if (typeof bootstrap !== 'undefined') {
    initModals();
    fetchStatus();
  } else {
    window.addEventListener('load', function() {
      initModals();
      fetchStatus();
    });
  }
})();
</script>
