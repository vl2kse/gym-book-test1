<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}GymBook{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <style>
        body { background-color: #f5f7fa; }
        .navbar { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .navbar-brand, .nav-link { color: #fff !important; }
        .nav-link:hover { opacity: 0.85; }
        .card { border: none; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .stat-card { text-align: center; padding: 1.5rem; }
        .stat-card .stat-value { font-size: 2rem; font-weight: 700; color: #667eea; }
        .stat-card .stat-label { color: #6c757d; font-size: 0.9rem; margin-top: 0.25rem; }
        .btn-primary { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border: none; }
        .btn-primary:hover { opacity: 0.9; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .set-row { transition: background-color 0.15s; }
        .set-row:hover { background-color: #f0f2ff; }
        .chart-container { position: relative; height: 250px; }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{% url 'workouts:dashboard' %}">GymBook</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="{% url 'workouts:dashboard' %}">Дашборд</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'workouts:workout_new' %}">+ Тренировка</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'workouts:workout_history' %}">История</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'workouts:exercise_list' %}">Упражнения</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'workouts:bodyweight_list' %}">Вес тела</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4 mb-5">
        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
