{% extends 'workouts/base.html' %}

{% block title %}GymBook - Записать вес{% endblock %}

{% block content %}
<h1 class="mb-4">Записать вес</h1>

<div class="card p-4" style="max-width:400px">
    <form method="post">
        {% csrf_token %}
        <div class="mb-3">
            <label class="form-label">Дата</label>
            <input type="date" name="date" class="form-control" value="{{ today }}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Вес (кг)</label>
            <input type="number" name="weight" class="form-control" step="0.1" min="20" max="300" placeholder="75.5" required autofocus>
        </div>
        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">Сохранить</button>
            <a href="{% url 'bodyweight_list' %}" class="btn btn-outline-secondary">Отмена</a>
        </div>
    </form>
</div>

{% endblock %}
