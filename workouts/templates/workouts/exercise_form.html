{% extends 'workouts/base.html' %}

{% block title %}GymBook - Добавить упражнение{% endblock %}

{% block content %}
<h1 class="mb-4">Добавить упражнение</h1>

<div class="card p-4" style="max-width:500px">
    <form method="post">
        {% csrf_token %}
        <div class="mb-3">
            <label class="form-label">Название</label>
            <input type="text" name="name" class="form-control" placeholder="Отжимания" required autofocus>
        </div>
        <div class="mb-3">
            <label class="form-label">Описание</label>
            <textarea name="description" class="form-control" rows="2" placeholder="Опционально..."></textarea>
        </div>
        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">Сохранить</button>
            <a href="{% url 'workouts:exercise_list' %}" class="btn btn-outline-secondary">Отмена</a>
        </div>
    </form>
</div>

{% endblock %}
